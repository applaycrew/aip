<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Certified AI Practitioner (AIF-C01 Korean Version)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: flex-start;
        }
        /* 컨테이너 공통 스타일 */
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            margin-top: 30px;
        }

        /* --- 시작(Start) 페이지 스타일 --- */
        #start-page {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        #start-page h1 {
            color: #232f3e;
            margin-bottom: 10px;
            font-size: 2em;
        }
        #start-page .subtitle {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .date-input {
            font-size: 1em;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 5px;
            width: 90px;
            text-align: center;
            font-family: inherit;
            background-color: #fff;
        }
        .date-input:focus {
            outline: none;
            border-color: #007bff;
        }
        #start-page .version-info {
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 40px;
            color: #333;
            font-weight: bold;
        }
        .start-btn {
            background-color: #ff9900;
            color: white;
            font-size: 1.04em; 
            font-weight: bold;
            padding: 12px 32px; 
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.1s;
        }
        .start-btn:hover {
            background-color: #e88b00;
        }
        .start-btn:active {
            transform: scale(0.98);
        }

        /* --- 문제 풀이(Quiz) 페이지 스타일 --- */
        #quiz-page {
            display: none; 
        }
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .progress-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .progress {
            font-size: 1em;
            color: #555;
            font-weight: bold;
        }
        .jump-container {
            display: flex;
            gap: 5px;
        }
        .jump-container input {
            width: 81px;
            padding: 4.5px;
            font-size: 0.9em;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .jump-container button {
            padding: 5px 10px; 
            font-size: 0.85em; 
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .jump-container button:hover {
            background-color: #5a6268;
        }
        
        /* 하단 컨트롤 영역 (양쪽 정렬) */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .review-btn {
            padding: 8px 16px; 
            font-size: 0.8em; 
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .review-btn:hover {
            background-color: #138496;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.2em;
            line-height: 1.5;
        }
        .instruction {
            color: #007bff;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options {
            margin-top: 20px;
        }
        .option-label {
            display: block;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .option-label:hover {
            background-color: #e9ecef;
        }
        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .quiz-btn {
            padding: 8px 16px; 
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 0.8em; 
            cursor: pointer;
            font-weight: bold;
        }
        .quiz-btn:hover {
            background-color: #0056b3;
        }
        .quiz-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #prev-btn, #next-btn {
            padding: 4px 8px;
        }
        
        #submit-btn-wrapper {
            margin-left: auto; 
        }
        #submit-btn {
            background-color: #28a745;
        }
        #submit-btn:hover {
            background-color: #218838;
        }
        #bottom-next-btn {
            background-color: #007bff;
        }
        #bottom-next-btn:hover {
            background-color: #0056b3;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .explanation {
            margin-top: 10px;
            font-size: 0.95em;
        }

        /* --- 문제 풀이 결과(Review) 페이지 스타일 --- */
        #review-page {
            display: none;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .review-header h2 {
            margin: 0;
            color: #232f3e;
        }
        
        /* 통계/범례 영역 정렬 문제 해결을 위해 grid 레이아웃 사용 */
        .review-legend {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 모바일 대응: 무조건 2열 배치 */
            gap: 15px 10px; /* 위아래 15px, 양옆 10px 간격 */
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #333;
            font-weight: bold;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e9ecef;
            align-items: center;
        }
        /* PC 환경 등 화면이 넓을 때 4열로 한 줄에 표시 */
        @media (min-width: 500px) {
            .review-legend {
                grid-template-columns: repeat(4, auto);
                justify-content: center;
            }
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap; /* 글씨 줄바꿈 방지 */
        }
        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .legend-unsolved { background-color: #f9f9f9; }
        .legend-correct { background-color: #d4edda; border-color: #c3e6cb; }
        .legend-incorrect { background-color: #f8d7da; border-color: #f5c6cb; }
        
        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 7px;
            max-height: 450px;
            overflow-y: auto;
            padding-top: 2px;
            padding-right: 5px;
        }
        .review-item {
            padding: 7px 3px;
            font-size: 0.85em;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .review-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .review-item.unsolved { background-color: #f9f9f9; color: #333; }
        .review-item.correct { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .review-item.incorrect { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    </style>
</head>
<body>

<!-- 시작(Start) 페이지 -->
<div class="container" id="start-page">
    <div class="version-info">Get your IT certification easily and conveniently!</div>
    <h1>AWS Certified Generative AI Developer Professional</h1>
    <div class="subtitle">
        Exam: AIP-C01-KR (Korean Version)<br>
        Number of questions: <span id="start-total-q"></span><br>
        Vendor: Amazon<br>
        Date: 08/2026
    </div>
    <button class="start-btn" onclick="startQuiz()">Start 🚀</button>
</div>

<!-- 문제 풀이(Quiz) 페이지 -->
<div class="container" id="quiz-page">
    <div class="top-controls">
        <button class="quiz-btn" id="prev-btn" onclick="prevQuestion()" disabled>prev</button>
        
        <div class="progress-wrapper">
            <div class="progress" id="progress-text"></div>
            <div class="jump-container">
                <input type="number" id="jump-input" placeholder="문제번호" min="1" onkeypress="handleEnter(event)">
                <button onclick="jumpToQuestion()">이동</button>
            </div>
        </div>

        <button class="quiz-btn" id="next-btn" onclick="nextQuestion()">next</button>
    </div>

    <div id="question-number" style="color: #666; margin-bottom: 5px; font-weight: bold;"></div>
    <div class="instruction" id="question-instruction"></div>
    <h2 id="question-text">문제 로딩 중...</h2>
    
    <div class="options" id="options-container">
        <!-- 옵션 동적 추가 -->
    </div>

    <!-- 피드백(해설) 영역 -->
    <div class="feedback" id="feedback-container">
        <strong id="feedback-title"></strong>
        <div class="explanation" id="feedback-explanation"></div>
    </div>

    <!-- 하단 컨트롤 -->
    <div class="bottom-controls">
        <button class="review-btn" onclick="showReviewPage()">📊 문제 풀이 결과</button>
        <div id="submit-btn-wrapper">
            <button class="quiz-btn" id="submit-btn" onclick="checkAnswer()">정답 확인 ✔</button>
            <button class="quiz-btn" id="bottom-next-btn" onclick="nextQuestion()" style="display: none;">다음 문제 ▶</button>
        </div>
    </div>
</div>

<!-- 문제 풀이 결과(Review) 페이지 -->
<div class="container" id="review-page">
    <div class="review-header">
        <h2>문제 풀이 결과</h2>
        <button class="quiz-btn" onclick="hideReviewPage()">돌아가기 ↩</button>
    </div>
    
    <!-- 숫자와 글자가 하나의 요소 안에 위치하여 높이(baseline) 정렬이 완벽하게 맞도록 수정된 범례 영역 -->
    <div class="review-legend">
        <div class="legend-item">
            <span>총 문항수: <span id="stat-total" style="color:#007bff; margin-left: 2px;">0</span></span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-correct"></div> 
            <span>정답: <span id="stat-correct" style="color:#155724; margin-left: 2px;">0</span></span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-incorrect"></div> 
            <span>오답: <span id="stat-incorrect" style="color:#721c24; margin-left: 2px;">0</span></span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-unsolved"></div> 
            <span>미풀이: <span id="stat-unsolved" style="color:#555; margin-left: 2px;">0</span></span>
        </div>
    </div>

    <div class="review-grid" id="review-grid">
        <!-- 그리드 아이템 동적 추가 -->
    </div>
</div>

<script>
    // 기존에 만들어둔 전체 문제 객체를 여기에 모두 붙여넣으세요.
    const questions = [
        {
            id: 1,
            question: "한 대학교가 최근 기록 문서, 학술 저널 및 원고 모음을 디지털화했습니다. 이 대학교는 디지털 파일을 AWS Lake Formation 데이터 레이크에 저장합니다. 대학은 텍스트 쿼리를 사용하여 디지털 파일을 검색할 수 있는 솔루션을 구축하기 위해 GenAl 개발자를 고용합니다. 이 솔루션은 사용자의 쿼리와 의미적으로 유사한 저널 초록을 반환해야 합니다. 사용자는 저널 초록과 관련된 텍스트 및 메타데이터를 기반으로 디지털화된 자료를 검색할 수 있어야 합니다. 디지털 파일의 메타데이터에는 키워드가 포함되어 있지 않습니다. 이 솔루션은 텍스트 유사성을 기반으로 유사한 초록들을 서로 매칭해야 합니다. 데이터 레이크에는 100만 개 미만의 파일이 포함되어 있습니다. 어떤 솔루션이 운영 부담을 최소화하면서 이러한 요구 사항을 충족할까요?",
            options: [
                { id: "A", text: "Amazon Bedrock에서 Amazon Titan Embeddings를 사용하여 디지털화된 파일의 벡터 표현을 생성합니다. 생성된 임베딩은 Amazon OpenSearch Service OpenSearch Neural 플러그인에 저장합니다." },
                { id: "B", text: "Amazon Comprehend를 사용하여 디지털화된 파일에서 주제를 추출합니다. 추출된 주제와 파일 메타데이터를 Amazon Aurora PostgreSQL 데이터 베이스에 저장합니다. Aurora 데이터베이스의 데이터를 대상으로 추출된 추상 메타데이터를 쿼리합니다." },
                { id: "C", text: "Amazon SageMaker AI를 사용하여 문장 변환기 모델을 배포합니다. 해당 모델을 사용하여 디지털화된 파일의 벡터 표현을 생성합니다. 생성된 임베딩을 pgvector 확장자를 가진 Amazon Aurora PostgreSQL 데이터베이스에 저장합니다." },
                { id: "D", text: "Amazon Bedrock에서 Amazon Titan Embeddings를 사용하여 디지털화된 파일의 벡터 표현을 생성합니다. 생성된 임베딩은 pgvector 확장자를 가진 Amazon Aurora PostgreSQL 서버리스 데이터베이스에 저장합니다." }
            ],
            answer: "D",
            explanation: "[키워드] 운영부담 최소\n\n[정답 D] Amazon Bedrock + Amazon Titan Embeddings + pgvector + Amazon Aurora PostgreSQL -> 완전 관리형 임베딩 서비스와 자동 확장이 가능한 벡터 데이터베이스를 결합하여 최소한의 운영 부담으로 진정한 의미 검색을 제공하므로 최적의 선택입니다.\n\n[오답] A: 벡터 검색도 가능하게 하지만, OpenSearch 도메인을 운영하면 일반적으로 도메인 운영 부담이 있습니다. / B: 주제 추출이 임베딩 기반의 의미 일치와 동일하지 않기 때문에 의미 유사성 요구 사항을 충족하지 못합니다. / C: SageMaker AI에 문장 변환 모델 엔드포인트를 배포하고 운영해야 하므로 운영 부담이 발생합니다."
        },
        {
            id: 2,
            question: "한 회사가 Amazon Bedrock 기반 모델(FM)을 사용하는 생성형 Al(GenAI) 애플리케이션을 개발하고 있습니다. 이 애플리케이션은 Microsoft Entra ID를 사용하여 인증해야 합니다. 모든 FM API 호출은 사설 네트워크 경로를 통해 이루어져야 합니다. 애플리케이션 접근 권한은 부서별로 특정 모델 제품군에 한해 제한되어야 합니다. 또한, 회사는 모델 상호 작용에 대한 포괄적인 감사 추적 기능을 필요로 합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?",
            options: [
                { id: "A", text: "Microsoft Entra ID와 AWS Identity and Access Management 간의 SAML 페더레이션을 구성합니다. 부서별 IAM 역할을 생성하여 필요한 Modelld 값만 허용합니다. Amazon Bedrock 런타임 서비스를 위한 AWS PrivateLink 인터페이스 VPC 엔드포인트를 생성합니다. AWS CloudTrail을 활성화하여 Amazon Bedrock API 호출을 캡처합니다. Amazon Bedrock 모델 호출 로깅을 구성하여 모델 상호 작용에 대한 자세한 기록을 저장합니다." },
                { id: "B", text: "Microsoft Entra ID를 사용하여 인증하기 위해 IAM에서 ID 공급자(IdP) 연결을 생성합니다. 부서별 권한 세트를 할당하여 특정 모델 제품군에 대한 액세스를 제어합니다. AWS Lambda 함수를 NAT 게이트웨이가 있는 프라이빗 서브넷에 배포하여 Amazon Bedrock 공용 엔드포인트로 내보낼 수 있습니다. 감사 목적으로 모델 상호 작용을 캡처하려면 CloudWatch Logs를 활성화하십시오." },
                { id: "C", text: "Microsoft Entra ID를 사용하여 인증하기 위해 IAM에서 SAML ID 공급자(IdP)를 생성합니다. 부서 역할에 따라 IAM 권한 경계를 설정하여 Amazon Bedrock API 엔드포인트를 제한하고, VPC 라우팅을 통 특정 모델 제품군에 대한 액세스 권한을 구성합니다. 공개 설정을 구성합니다. 해 프라이빗 네트워크 연결을 유지합니다. 모델 상호 작용에 대한 감사 로그를 관리하기 위해 Amazon S3 수명 주기 규칙으로 CloudTrail을 설정합니다." },
                { id: "D", text: "Microsoft Entra ID와 IAM 간의 OpenID Connect(OIDC) 페더레이션을 구성합니다. 속성 기반 액세스 제어를 사용하여 부서 속성을 특정 모델 액세스 권한에 매핑합니다. SCP 정책을 적용하여 부서를 기준으로 Amazon Bedrock FM 제품군에 대한 액세스를 제한합니다. Microsoft Entra를 사용합니다. ID 모델 상호 작용에 대한 감사 추적을 유지하기 위한 내장 로깅 기능." }

            question: "한 회사가 Amazon Bedrock을 사용하여 검색 증강 생성(RAG) 시스템을 구축했습니다. RAG 시스템은 긴급 뉴스 영상 콘텐 츠의 데이터 소스로 Amazon S3 버킷 기반의 Amazon Bedrock 지식 베이스를 사용합니다. 시스템은 S3 버킷에서 녹취록, 보관된 보고서 및 관련 문서를 검색합니다. RAG 시스템은 최첨단 임베딩 모델과 고성능 검색 설정을 사용합니다. 하지만 사용자 들은 느린 응답 속도와 관련성 없는 검색 결과를 보고하며, 이로 인해 사용자 만족도가 저하된다고 지적합니다. 회사 측은 벡터 검 색이 너무 많은 문서와 다양한 콘텐츠 유형을 오랜 시간에 걸쳐 평가하고 있다는 점을 발견했습니다. 해당 회사는 기본 모델에 추가 적인 미세 조정을 해도 성능 향상이 없을 것으로 판단했습니다. 회사는 보다 스마트한 제약 조건을 적용하여 검색 정확도를 향상시 켜야 하며, 기존 아키텍처를 최소한으로 변경하는 솔루션을 원합니다. 어떤 솔루션이 이러한 요구 사항을 충족할까요?",
            options: [
                { id: "A", text: "응급 뉴스 콘텐츠에 특화된 도메인 적응형 모델을 사용하여 벡터 유사성을 향상시켜 임베딩을 개선합니다." },
                { id: "B", text: "Amazon OpenSearch 서비스로 마이그레이션합니다. 벡터 필드와 메타데이터 필터를 사용하여 결과 검색 범위를 정의합 니다." },
                { id: "C", text: "S3 객체 메타데이터를 인덱싱하여 Amazon Bedrock 지식 기반 내에서 메타데이터 인식 필터링을 활성화합니다." },
                { id: "D", text: "검색 시 구조화된 메타데이터 필터링 및 문서 분류를 수행하기 위해 Amazon Q Business 인덱스로 마이그레이션합니다." }
            ],
            answer: "C",
            explanation: "[키워드] 최소 변경/개발 / 벡터/임베딩 / RAG / 지식 기반(KB) / 파인튜닝 / 모델 평가\n\n[정답 C] S3+ Amazon Bedrock Knowledge Bases -> S3 메타데이터를 인덱싱하여 지식 기반의 필터링을 도입하는 것은 기존 Amazon Bedrock RAG 시스템에서 검색 정확도와 성능을 향상시키는 데 가장 효과적이고 간편한 솔루션을 제공합니다.\n\n[오답] A: 임베딩 모델을 재학습하거나 수정해야 하는데, 회사는 이미 이로 인해 추가적인 이점이 없다고 판단했습니다. / B: OpenSearch로 마이그레이션하는 것으로, 운영 부담이 증가하고 기존 아키텍처를 크게 변경해야 합니다. / D: 다른 인덱싱 서비스로 이전해야 하므로 복잡성이 증가하고 구현에 더 많은 노력이 필요합니다."
        }
        // ... (나머지 전체 문제 데이터) ...
    ];

    // 시작 페이지에 총 문항 수 동적 표시
    document.getElementById('start-total-q').innerText = questions.length;

    let currentQuestionIndex = 0;

    // 시작 버튼 클릭 시 호출
    function startQuiz() {
        document.getElementById('start-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        loadQuestion();
    }

    // 문제 로드 함수
    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        const isMultiple = Array.isArray(q.answer);
        
        document.getElementById('progress-text').innerText = `문제 ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('question-number').innerText = `QUESTION NO: ${q.id}`;
        
        const instructionEl = document.getElementById('question-instruction');
        if (isMultiple) {
            instructionEl.innerText = `💡 ${q.answer.length}개의 정답을 선택하세요.`;
            instructionEl.style.display = 'block';
        } else {
            instructionEl.style.display = 'none';
        }

        document.getElementById('question-text').innerText = q.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const inputType = isMultiple ? 'checkbox' : 'radio';

        q.options.forEach(opt => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.innerHTML = `<input type="${inputType}" name="option" value="${opt.id}"> <strong>${opt.id}.</strong> ${opt.text}`;
            optionsContainer.appendChild(label);
        });

        const submitBtn = document.getElementById('submit-btn');
        const bottomNextBtn = document.getElementById('bottom-next-btn');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackExplanation = document.getElementById('feedback-explanation');
        
        if (q.status) {
            const inputs = document.querySelectorAll('input[name="option"]');
            inputs.forEach(input => {
                if (isMultiple) {
                    if (q.userSelection.includes(input.value)) input.checked = true;
                } else {
                    if (q.userSelection === input.value) input.checked = true;
                }
                input.disabled = true;
            });

            submitBtn.style.display = 'none';
            
            // 마지막 문제가 아닐 때만 다음 문제 버튼 표시
            if (currentQuestionIndex < questions.length - 1) {
                bottomNextBtn.style.display = 'block';
            } else {
                bottomNextBtn.style.display = 'none';
            }
            
            feedbackContainer.style.display = 'block';

            let correctAnswerText = isMultiple ? [...q.answer].sort().join(", ") : q.answer;
            feedbackExplanation.innerHTML = `<strong>정답: ${correctAnswerText}</strong><br><br>${q.explanation}`;

            if (q.status === 'correct') {
                feedbackContainer.className = 'feedback correct';
                feedbackTitle.innerText = '정답입니다! 🎉';
            } else {
                feedbackContainer.className = 'feedback incorrect';
                feedbackTitle.innerText = '오답입니다. ❌';
            }
        } else {
            submitBtn.style.display = 'block';
            bottomNextBtn.style.display = 'none';
            feedbackContainer.style.display = 'none';
        }

        document.getElementById('jump-input').value = '';
        document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
        document.getElementById('next-btn').disabled = currentQuestionIndex === questions.length - 1;
    }

    // 정답 확인 함수
    function checkAnswer() {
        const q = questions[currentQuestionIndex];
        const isMultiple = Array.isArray(q.answer);
        
        let isCorrect = false;
        let correctAnswerText = "";

        if (isMultiple) {
            const selectedNodes = document.querySelectorAll('input[name="option"]:checked');
            const selectedValues = Array.from(selectedNodes).map(el => el.value).sort();
            
            if (selectedValues.length === 0) {
                alert('하나 이상의 답을 선택해주세요!');
                return;
            }
            
            const sortedAnswer = [...q.answer].sort();
            isCorrect = JSON.stringify(selectedValues) === JSON.stringify(sortedAnswer);
            correctAnswerText = sortedAnswer.join(", ");
            q.userSelection = selectedValues;
        } else {
            const selected = document.querySelector('input[name="option"]:checked');
            if (!selected) {
                alert('답을 선택해주세요!');
                return;
            }
            isCorrect = selected.value === q.answer;
            correctAnswerText = q.answer;
            q.userSelection = selected.value;
        }

        q.status = isCorrect ? 'correct' : 'incorrect';

        const inputs = document.querySelectorAll('input[name="option"]');
        inputs.forEach(input => input.disabled = true);

        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackExplanation = document.getElementById('feedback-explanation');

        feedbackContainer.style.display = 'block';
        feedbackExplanation.innerHTML = `<strong>정답: ${correctAnswerText}</strong><br><br>${q.explanation}`;

        if (isCorrect) {
            feedbackContainer.className = 'feedback correct';
            feedbackTitle.innerText = '정답입니다! 🎉';
        } else {
            feedbackContainer.className = 'feedback incorrect';
            feedbackTitle.innerText = '오답입니다. ❌';
        }
        
        // 정답 확인 버튼 숨기고 다음 문제 버튼 표시 (마지막 문제 제외)
        document.getElementById('submit-btn').style.display = 'none';
        if (currentQuestionIndex < questions.length - 1) {
            document.getElementById('bottom-next-btn').style.display = 'block';
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function jumpToQuestion() {
        const targetId = parseInt(document.getElementById('jump-input').value);
        if (isNaN(targetId)) {
            alert("이동할 문제 번호를 입력해주세요.");
            return;
        }

        const targetIndex = questions.findIndex(q => q.id === targetId);
        
        if (targetIndex !== -1) {
            currentQuestionIndex = targetIndex;
            loadQuestion();
        } else {
            alert(`입력하신 ${targetId}번 문제는 존재하지 않습니다.`);
        }
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            jumpToQuestion();
        }
    }

    // --- 문제 풀이 결과(Review) 페이지 관련 함수 --- //
    
    function showReviewPage() {
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('review-page').style.display = 'block';
        
        const reviewGrid = document.getElementById('review-grid');
        reviewGrid.innerHTML = ''; 

        let correctCount = 0;
        let incorrectCount = 0;
        let unsolvedCount = 0;

        questions.forEach((q, index) => {
            // 통계 계산
            if (q.status === 'correct') {
                correctCount++;
            } else if (q.status === 'incorrect') {
                incorrectCount++;
            } else {
                unsolvedCount++;
            }

            // 그리드 아이템 렌더링
            const item = document.createElement('div');
            item.className = `review-item ${q.status || 'unsolved'}`;
            item.innerText = q.id; 
            
            item.onclick = () => {
                goToQuestionFromReview(index);
            };
            reviewGrid.appendChild(item);
        });

        // 통계 텍스트 업데이트
        const totalCount = questions.length;
        document.getElementById('stat-total').innerText = totalCount;
        document.getElementById('stat-correct').innerText = correctCount;
        document.getElementById('stat-incorrect').innerText = incorrectCount;
        document.getElementById('stat-unsolved').innerText = unsolvedCount;
    }

    function hideReviewPage() {
        document.getElementById('review-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
    }

    function goToQuestionFromReview(index) {
        currentQuestionIndex = index;
        hideReviewPage();
        loadQuestion();
    }

</script>
